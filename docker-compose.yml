services:
  miniflux-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - miniflux_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniflux:
    image: miniflux/miniflux:2.2.16
    restart: unless-stopped
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASSWORD}@miniflux-db/miniflux?sslmode=disable
      BASE_URL: ${MINIFLUX_BASE_URL}
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
    volumes:
      - ./data/miniflux:/var/lib/miniflux
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pokemoncollector_proxy"
      - "traefik.http.routers.miniflux.rule=Host(`rss.astribelli.com`)"
      - "traefik.http.routers.miniflux.entrypoints=websecure"
      - "traefik.http.routers.miniflux.tls=true"
      - "traefik.http.routers.miniflux.tls.certresolver=letsencrypt"
      - "traefik.http.services.miniflux.loadbalancer.server.port=8080"

  openrouter_fallback_proxy:
    build: ./openrouter-fallback-proxy
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-meta-llama/llama-3.3-70b-instruct:free,qwen/qwen3-next-80b-a3b-instruct:free,openai/gpt-oss-20b:free}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-120}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-rss-miniflux-ai}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  miniflux_ai:
    image: ghcr.io/qetesh/miniflux-ai:latest
    restart: unless-stopped
    depends_on:
      miniflux:
        condition: service_started
      openrouter_fallback_proxy:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      MINIFLUX_BASE_URL: http://miniflux:8080
      MINIFLUX_API_KEY: ${MINIFLUX_API_KEY}
      MINIFLUX_AI_POLL_INTERVAL: ${MINIFLUX_AI_POLL_INTERVAL:-5}
      MINIFLUX_AI_PROVIDER_BASE_URL: ${MINIFLUX_AI_PROVIDER_BASE_URL:-http://openrouter_fallback_proxy:8081/v1}
      MINIFLUX_AI_PROVIDER_API_KEY: ${MINIFLUX_AI_PROVIDER_API_KEY:-openrouter-proxy}
      MINIFLUX_AI_MODEL: ${MINIFLUX_AI_MODEL:-openrouter/free}
      MINIFLUX_AI_TIMEOUT: ${MINIFLUX_AI_TIMEOUT:-60}
      MINIFLUX_AI_MAX_WORKERS: ${MINIFLUX_AI_MAX_WORKERS:-1}
      MINIFLUX_AI_RPM: ${MINIFLUX_AI_RPM:-1}
    volumes:
      - ./miniflux-ai/config.template.yml:/app/config.template.yml:ro
      - ./miniflux-ai/bootstrap_config.py:/app/bootstrap_config.py:ro
      - ./miniflux-ai/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    command: ["/bin/sh", "/app/docker-entrypoint.sh"]

  linkwarden-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LINKWARDEN_POSTGRES_PASSWORD}
    volumes:
      - linkwarden_pg:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - linkwarden_meili:/meili_data

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.13.5
    restart: unless-stopped
    depends_on:
      - linkwarden-db
      - meilisearch
    environment:
      NEXTAUTH_URL: ${LINKWARDEN_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://postgres:${LINKWARDEN_POSTGRES_PASSWORD}@linkwarden-db:5432/postgres
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - linkwarden_data:/data/data
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pokemoncollector_proxy"
      - "traefik.http.routers.linkwarden.rule=Host(`links.astribelli.com`)"
      - "traefik.http.routers.linkwarden.entrypoints=websecure"
      - "traefik.http.routers.linkwarden.tls=true"
      - "traefik.http.routers.linkwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.linkwarden.loadbalancer.server.port=3000"

  archivebox:
    image: archivebox/archivebox:stable
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: ${ARCHIVEBOX_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${ARCHIVEBOX_CSRF_TRUSTED_ORIGINS}
    volumes:
      - archivebox_data:/data
    command: server --quick-init 0.0.0.0:8000
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pokemoncollector_proxy"
      - "traefik.http.routers.archivebox.rule=Host(`archive.astribelli.com`)"
      - "traefik.http.routers.archivebox.entrypoints=websecure"
      - "traefik.http.routers.archivebox.tls=true"
      - "traefik.http.routers.archivebox.tls.certresolver=letsencrypt"
      - "traefik.http.services.archivebox.loadbalancer.server.port=8000"

  archivebox-webhook:
    build: ./archivebox-webhook
    restart: unless-stopped
    depends_on:
      - archivebox
    ports:
      - "8090:8090"
    environment:
      MINIFLUX_WEBHOOK_SECRET: ${MINIFLUX_WEBHOOK_SECRET}
      ARCHIVEBOX_CONTAINER_NAME: ${ARCHIVEBOX_CONTAINER_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  miniflux_db:
  linkwarden_pg:
  linkwarden_meili:
  linkwarden_data:
  archivebox_data:

networks:
  proxy:
    external: true
    name: pokemoncollector_proxy
